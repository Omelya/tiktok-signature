services:
  tiktok-signature:
    build:
      context: .
      dockerfile: Dockerfile
    # The API has no auth: keep it on localhost (or an internal Docker
    # network) so nobody else can spend your proxy traffic through it.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - PROXY_ENABLED=${PROXY_ENABLED:-false}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - MAX_GENERATIONS_BEFORE_REFRESH=${MAX_GENERATIONS_BEFORE_REFRESH:-500}
      - MAX_SESSION_AGE_MS=${MAX_SESSION_AGE_MS:-1800000}
      - IDENTITY_POOL_SIZE=${IDENTITY_POOL_SIZE:-3}
      - REPORT_MIN_AGE_MS=${REPORT_MIN_AGE_MS:-15000}
      - REPORT_RETIRE_COOLDOWN_MS=${REPORT_RETIRE_COOLDOWN_MS:-20000}
      - IDLE_SHUTDOWN_MS=${IDLE_SHUTDOWN_MS:-600000}
      - WARM_ON_START=${WARM_ON_START:-true}
      - STATIC_CACHE_MAX_MB=${STATIC_CACHE_MAX_MB:-64}
      - BLOCKED_RESOURCE_TYPES=${BLOCKED_RESOURCE_TYPES:-image,media,font}
      - LEAN_CHROME_FLAGS=${LEAN_CHROME_FLAGS:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M
